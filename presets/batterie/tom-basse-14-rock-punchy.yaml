instrument: Batterie
element: Tom basse 14-16
style: Rock punchy
notes: >-
  Standard tom basse 14", micro dynamique type cardioïde (T-Bone
  CD55 ou équivalent), pointé vers le centre de la peau, 30° d'angle. Peau Evans G2 blanche.
  HPF à 70 Hz. Gate patient (hold 100 ms, release 350 ms) : les toms
  basse résonnent longuement, un gate court les décapite. EQ : corps
  autour de 100 Hz (plus haut que le 16"), creux de "carton" à 400 Hz.
  Compresseur 3:1 à release longue. Voir tom-basse-16 pour l'autre tom.
config:
  name: "Tom 14"
  color: 6
